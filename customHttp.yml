# Security HTTP headers — served by AWS Amplify on every response.
#
# ⛔ Amplify reads THIS file. It does NOT read `_headers` (that is Netlify / Cloudflare Pages).
#    Always verify at the receiving end, not in the repo:
#      curl -sI https://www.stacksolveruk.com | grep -iE 'strict-transport|content-security|x-frame'
#
# Design notes (2026-08-06):
#  - HSTS without `includeSubDomains` and without `preload` on purpose: subdomain HTTPS
#    coverage is unverified, and `preload` is effectively irreversible.
#  - The CSP ships as Report-Only: the browser reports violations to the console but
#    blocks nothing. Observe in production, then make it binding by renaming the key to
#    `Content-Security-Policy`.
#  - Permissions-Policy denies the sensitive features but leaves Vimeo the autoplay and
#    fullscreen it needs for the background players.

customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Permissions-Policy'
        value: 'accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=(), autoplay=(self "https://player.vimeo.com"), fullscreen=(self "https://player.vimeo.com")'
      # Third-party inventory measured 2026-08-06 across src/ and public/:
      #   frame-src   player.vimeo.com  (service subsection pages)
      #   connect-src formspree.io      (contact form fetch — verified in the served bundle
      #               on 2026-08-10: it is the form's ONLY external destination)
      #   the dead pdf.js CDN script was removed in PR #3 — no external <script src> left
      #
      # BINDING since 2026-08-10. It ran as Report-Only first and this site reported ZERO
      # violations across the home page and a service page — the only site of the four that
      # needed no adjustment. Note `font-src 'self'` WITHOUT `data:`: unlike the other two,
      # this build does not inline its fonts as data URIs, so the stricter value holds.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; frame-src https://player.vimeo.com; form-action 'self' https://formspree.io"
